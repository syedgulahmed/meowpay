<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeowPay</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">

  <!-- Home Screen -->
  <div id="screen-list">
    <h1>MeowPay</h1>

  </div>

  <!-- Send Screen -->
  <div id="screen-send" class="hidden">
    <button class="back-btn" id="back-btn">&larr; Back</button>

    <div class="sender-info">
      <span class="avatar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9 L8 4 L9.5 10"/><path d="M19 9 L16 4 L14.5 10"/><circle cx="12" cy="14" r="7.5"/></svg></span>
      <p><strong id="sender-name"></strong> — <span id="sender-balance"></span> treats</p>
    </div>

    <label for="recipient">Send to</label>
    <select id="recipient"></select>

    <label for="amount">Amount</label>
    <input type="number" id="amount" placeholder="0" min="1" inputmode="numeric">

    <button class="send-btn" id="send-btn">Send treat</button>
    <button class="send-btn hidden" id="send-another-btn">Send another</button>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </div>

</div>
<script src="script.js"></script>
</body>
</html>
